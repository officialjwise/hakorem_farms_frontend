name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated tokens are up to date
        run: pnpm tokens:check
      - name: Cedi glyph face is up to date
        run: pnpm fonts:check
      - name: Console icons and manifest are up to date
        run: pnpm icons:check
      - name: Generated API client matches the committed contract
        run: pnpm sync-contract:check
      - name: Lint (ESLint, Stylelint, token roles)
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests (components, contrast, lint rules)
        run: pnpm test:unit
      - name: Integration tests against the real Prism mock
        run: pnpm test:integration
      - name: Install Chromium
        run: pnpm --filter @hakorem/ui exec playwright install --with-deps chromium
      - name: Story tests with axe (WCAG 2.2 AA)
        run: pnpm test:a11y
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Build the console (typecheck, then Vite), against the /mock path the e2e suite serves
        run: pnpm build:console
        env:
          HK_API_BASE_URL: /mock
          # The contract requests the e2e fake answers in their requested shape (ADR 0046).
          HK_REQUESTED_CONTRACT: CR-033,CR-059
          # The shop's address in a quote's link (ADR 0056): the e2e suite's storefront.
          HK_SHOP_URL: http://127.0.0.1:3100
      - name: Build the investor portal, its own build for its own host (ADR 0058)
        run: pnpm build:investor
        env:
          HK_API_BASE_URL: /mock
      - name: Console bundle budget, per document (ADR 0030, PERFORMANCE_BUDGET.md)
        run: pnpm budget:console
      - name: Build the storefront (Next.js), against the e2e suite's shop API in front of Prism (ADR 0054)
        run: pnpm build:storefront
        env:
          HK_API_BASE_URL: http://127.0.0.1:4011
      - name: Storefront script budget, per route (PERFORMANCE_BUDGET.md)
        run: pnpm budget:storefront
      - name: End to end at 360 px, with axe (Playwright)
        run: pnpm --filter @hakorem/e2e test
